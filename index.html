<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Moderno - Equipe de Devs</title>
    <!-- Vinculação do arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Div Principal do Cartão -->
    <div class="profile-card">
        <!-- Imagem de Perfil Enviada (Avatar Padrão) -->
        <img src="perfil.jpg" alt="Foto de Perfil do Desenvolvedor" class="profile-img">
        
        <!-- Nome Profissional -->
        <h1 class="profile-name">Riciane Hosel</h1>
        
        <!-- Profissão -->
        <p class="profile-role">Desenvolvedora</p>
        
        <!-- Botão de Ação -->
        <a href="#" class="portfolio-btn">Ver Portfólio</a>
    </div>

</body>
</html>
